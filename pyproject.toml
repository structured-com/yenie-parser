[project]
name = "yenie-parser"
version = "0.5.0"
description = "Small, standalone Cisco CLI parsers derived from Cisco's Genie parsers"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["cisco", "iosxe", "parser", "networking", "cli"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/structured-com/yenie-parser"
Issues = "https://github.com/structured-com/yenie-parser/issues"

[project.scripts]
yenie-parser = "yenie_parser._cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"
